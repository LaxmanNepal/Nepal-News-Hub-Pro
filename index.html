<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e11d48">
<title>Nepal News Hub Pro — Live Nepal News</title>
<meta name="description" content="Nepal News Hub Pro aggregates fresh Nepal news, business, sports and technology headlines from multiple news outlets.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:'Plus Jakarta Sans',sans-serif;background:#f8fafc}.card{transition:.2s}.card:hover{transform:translateY(-2px);box-shadow:0 12px 30px #0f172a12}.pill{white-space:nowrap}.hide-scroll::-webkit-scrollbar{display:none}.hide-scroll{scrollbar-width:none}</style>
</head>
<body class="text-slate-900">
<header class="sticky top-0 z-50 bg-white/90 backdrop-blur border-b border-slate-200"><div class="max-w-7xl mx-auto px-4 py-3 flex gap-4 items-center"><a href="./" class="font-black text-xl">Nepal<span class="text-rose-600">Hub</span></a><div class="flex-1 relative"><input id="search" class="w-full bg-slate-100 rounded-full px-5 py-2.5 text-sm outline-none focus:ring-2 focus:ring-rose-200" placeholder="Search Nepal news..."></div><button id="refresh" class="px-4 py-2 rounded-full bg-slate-900 text-white text-xs font-black">Refresh</button></div></header>
<main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
<section class="grid lg:grid-cols-3 gap-4"><div class="lg:col-span-2 bg-slate-900 text-white rounded-3xl p-6"><div class="flex justify-between gap-3"><div><p class="text-xs font-black uppercase tracking-widest text-rose-300">Live Nepal News</p><h1 class="text-3xl font-black mt-2">What Nepal is talking about now</h1><p id="status" class="text-sm text-slate-300 mt-2">Loading latest stories…</p></div><div class="text-right"><b id="count" class="text-3xl">0</b><p class="text-xs text-slate-400">stories</p></div></div></div><div class="bg-white rounded-3xl border p-6"><p class="text-xs font-black uppercase tracking-widest text-slate-400">Intelligence</p><div class="grid grid-cols-2 gap-3 mt-4"><div class="bg-rose-50 rounded-2xl p-4"><b id="breaking" class="text-2xl text-rose-600">0</b><p class="text-xs font-bold text-slate-500">Breaking</p></div><div class="bg-slate-50 rounded-2xl p-4"><b id="sources" class="text-2xl">0</b><p class="text-xs font-bold text-slate-500">Sources</p></div></div></div></section>
<nav id="cats" class="flex gap-2 overflow-x-auto hide-scroll pb-1"></nav>
<section id="socialNews" class="bg-white rounded-3xl border p-4"><div class="flex items-center justify-between mb-3"><div><p class="text-[10px] font-black uppercase tracking-widest text-rose-600">Social News</p><h2 class="text-xl font-black">Stories & Reels</h2></div><button id="openReels" class="px-4 py-2 rounded-full bg-slate-900 text-white text-xs font-black">▶ Watch Reels</button></div><div id="storyStrip" class="flex gap-3 overflow-x-auto hide-scroll pb-2"></div></section>
<section><div class="flex items-center justify-between mb-4"><h2 id="heading" class="text-xl font-black">Latest Headlines</h2><span id="updated" class="text-xs font-bold text-slate-400"></span></div><div id="feed" class="grid sm:grid-cols-2 xl:grid-cols-3 gap-5"></div></section>
</main>
<div class="reel-modal" id="reelModal"><button class="reel-close" id="closeReels">×</button><div class="reel-feed" id="reelFeed"></div><div class="reel-hint">SWIPE UP FOR NEXT NEWS ↑</div></div>
<script>
const CATS=[['all','All'],['nepal','Nepal'],['sports','Sports'],['finance','Finance'],['tech','Technology'],['entertainment','Entertainment']];let allNews=[],active='all';
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); const safe=s=>esc(s).replace(/javascript:/gi,'');
function rel(d){const x=new Date(d),m=Math.floor((Date.now()-x)/60000);if(!Number.isFinite(m)||m<0)return'Recent';if(m<60)return`${m}m ago`;if(m<1440)return`${Math.floor(m/60)}h ago`;return`${Math.floor(m/1440)}d ago`}
function renderCats(){cats.innerHTML=CATS.map(([v,t])=>`<button data-cat="${v}" class="pill px-4 py-2 rounded-full text-xs font-black ${v===active?'bg-rose-600 text-white':'bg-white border text-slate-500'}">${t}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{active=b.dataset.cat;renderCats();render()})}
function card(i){return `<article class="card bg-white rounded-2xl border overflow-hidden"><div class="h-36 bg-slate-100"><img loading="lazy" src="${safe(i.thumb)}" class="w-full h-full object-cover" onerror="this.style.display='none'"></div><div class="p-5"><div class="flex gap-1 flex-wrap text-[9px] font-black uppercase"><span class="px-2 py-1 rounded-full bg-rose-50 text-rose-600">${esc(i.source)}</span>${i.isBreaking?'<span class="px-2 py-1 rounded-full bg-rose-50 text-rose-600">BREAKING</span>':''}${i.sourceCount>1?`<span class="px-2 py-1 rounded-full bg-slate-100 text-slate-600">${i.sourceCount} sources</span>`:''}</div><p class="text-[10px] text-slate-400 font-bold mt-2">${rel(i.pubDate)}</p><h3 class="font-extrabold leading-snug mt-2">${esc(i.title)}</h3><p class="text-xs text-slate-500 mt-2 line-clamp-3">${esc(i.desc||'')}</p><a href="${safe(i.link)}" target="_blank" rel="noopener noreferrer" class="block text-center mt-4 py-2.5 bg-slate-900 text-white rounded-xl text-[10px] font-black">READ FULL STORY</a></div></article>`}
function render(){let q=(search.value||'').toLowerCase().trim(),data=allNews.filter(i=>(active==='all'||(i.storyCategory||i.category)===active)&&(!q||`${i.title} ${i.source}`.toLowerCase().includes(q)));heading.textContent=active==='all'?'Latest Headlines':CATS.find(x=>x[0]===active)[1];feed.innerHTML=data.length?data.slice(0,120).map(card).join(''):`<div class="col-span-full bg-white border rounded-3xl p-12 text-center font-bold text-slate-400">No matching stories.</div>`;count.textContent=data.length;renderStories()}
function renderStories(){const stories=allNews.filter(x=>x.title).slice(0,16);storyStrip.innerHTML=stories.map((x,i)=>`<button class="story-bubble" data-story="${i}"><div class="story-ring">${x.thumb?`<img src="${safe(x.thumb)}" loading="lazy">`:`<div class="story-fallback">${esc(x.source||'N')}</div>`}</div><div class="mt-1 truncate">${esc(x.source||'News')}</div></button>`).join('');document.querySelectorAll('[data-story]').forEach(b=>b.onclick=()=>openReels(+b.dataset.story))}
function buildReels(){const items=allNews.filter(x=>x.title).slice(0,30);reelFeed.innerHTML=items.map(x=>`<article class="reel"><img src="${safe(x.thumb)}" loading="lazy"><div class="reel-copy"><div class="flex gap-2 flex-wrap text-[10px] font-black uppercase"><span>${esc(x.source||'Nepal News')}</span>${x.isBreaking?'<span>🔥 BREAKING</span>':''}${x.sourceCount>1?`<span>• ${x.sourceCount} SOURCES</span>`:''}</div><h3>${esc(x.title)}</h3><p>${esc(x.desc||'Latest news from Nepal.')}</p><a href="${safe(x.link)}" target="_blank" rel="noopener noreferrer" class="inline-block mt-4 bg-white text-slate-900 px-5 py-3 rounded-full text-xs font-black">READ NEWS ↗</a></div></article>`).join('')}
function openReels(index=0){buildReels();reelModal.classList.add('open');document.body.style.overflow='hidden';requestAnimationFrame(()=>reelFeed.children[index]?.scrollIntoView())}
async function load(){status.textContent='Syncing the latest generated feed…';try{const r=await fetch('./news.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);const d=await r.json();allNews=Array.isArray(d.items)?d.items:[];breaking.textContent=d.breakingCount??allNews.filter(x=>x.isBreaking).length;sources.textContent=new Set(allNews.map(x=>x.source)).size;updated.textContent=d.updatedAt?'Updated '+new Date(d.updatedAt).toLocaleString():'';status.textContent=`${allNews.length} stories from ${sources.textContent} publishers`;render()}catch(e){status.textContent='Feed temporarily unavailable. Retrying…'}}
search.oninput=render;refresh.onclick=load;openReels.onclick=()=>openReels();closeReels.onclick=()=>{reelModal.classList.remove('open');document.body.style.overflow=''};renderCats();load();setInterval(load,300000);
</script>
<script src="./js/social-news-ui.js"></script>
</body></html>
