<!doctype html>
<html lang="ne"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef3ff"><title>नेपाल हब — ताजा नेपाली समाचार</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3ff;--glass:rgba(255,255,255,.68);--line:rgba(255,255,255,.9);--ink:#111827;--muted:#64748b;--red:#ef233c;--shadow:0 18px 55px rgba(15,23,42,.12)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font-family:Poppins,'Noto Sans Devanagari',sans-serif;background:radial-gradient(circle at 0 0,#fff 0,#e9efff 38%,#f7f8fc 75%)}button,input{font:inherit}button{cursor:pointer}.app{max-width:1200px;margin:auto;padding:10px 14px 100px}.glass{background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%)}.header{position:sticky;top:9px;z-index:50;border-radius:26px;padding:10px;display:flex;gap:10px;align-items:center}.brand{font-size:21px;font-weight:900;white-space:nowrap}.brand b{color:var(--red)}.search{flex:1;position:relative}.search input{width:100%;border:0;outline:0;background:rgba(255,255,255,.65);border-radius:18px;padding:12px 14px 12px 40px;font-size:11px}.search i{position:absolute;left:14px;top:10px;color:var(--muted);font-style:normal}.icon{border:0;width:42px;height:42px;border-radius:16px;background:rgba(255,255,255,.75);font-size:16px}.nav,.chips,.stories{display:flex;gap:9px;overflow:auto;scrollbar-width:none}.nav::-webkit-scrollbar,.chips::-webkit-scrollbar,.stories::-webkit-scrollbar{display:none}.nav{padding:12px 2px}.nav button,.chips button{border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:9px 15px;font-size:10px;font-weight:800;white-space:nowrap;color:var(--muted)}.nav button.on,.chips button.on{background:#111827;color:white}.ticker{border-radius:18px;padding:9px 12px;display:flex;gap:10px;align-items:center;overflow:hidden}.ticker strong{background:var(--red);color:#fff;border-radius:10px;padding:6px 9px;font-size:8px;white-space:nowrap}.ticker span{font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hero{height:430px;border-radius:30px;overflow:hidden;position:relative;background:#111827}.hero img{position:absolute;width:100%;height:100%;object-fit:cover;opacity:.72}.hero:after,.reel:after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.92))}.hero-copy{position:absolute;z-index:2;left:24px;right:24px;bottom:24px;color:#fff}.label{font-size:9px;font-weight:900}.hero h1{font-size:clamp(27px,5vw,48px);line-height:1.12;margin:7px 0}.hero p{font-size:11px;color:#e5e7eb;max-width:700px;margin:0}.section{margin-top:25px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}.section-head h2{font-size:20px;margin:0}.section-head p{font-size:9px;color:var(--muted);margin:3px 0}.story{min-width:78px;border:0;background:transparent;text-align:center}.ring{width:66px;height:66px;border-radius:50%;padding:3px;background:conic-gradient(#ff3355,#ff9f1c,#7c3aed,#ff3355);margin:auto}.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid white}.story b{display:block;font-size:8px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.trend{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.trend-card{height:210px;border-radius:22px;overflow:hidden;position:relative;background:#111}.trend-card img{width:100%;height:100%;object-fit:cover;opacity:.7}.trend-card:after{content:"";position:absolute;inset:30% 0 0;background:linear-gradient(transparent,#000)}.trend-copy{position:absolute;z-index:2;bottom:14px;left:14px;right:14px;color:white}.trend-copy h3{font-size:14px;line-height:1.25;margin:7px 0 0}.badge{display:inline-block;background:#ffffffd9;color:#111827;border-radius:999px;padding:5px 8px;font-size:8px;font-weight:900}.breaking{color:#be123c;background:#ffe4e6}.feed{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{border-radius:22px;overflow:hidden}.thumb{height:185px;background:#e2e8f0}.thumb img{width:100%;height:100%;object-fit:cover}.body{padding:14px}.meta{font-size:8px;font-weight:900;color:var(--red)}.time{font-size:8px;color:#94a3b8;margin:5px 0}.card h3{font-size:14px;line-height:1.35;margin:0}.card p{font-size:10px;color:var(--muted);line-height:1.55}.read{display:block;text-decoration:none;text-align:center;background:#111827;color:#fff;border-radius:12px;padding:9px;font-size:9px;font-weight:900;margin-top:10px}.bottom{position:fixed;z-index:80;left:50%;bottom:10px;transform:translateX(-50%);width:min(540px,calc(100% - 22px));border-radius:25px;padding:6px;display:flex}.bottom button{flex:1;border:0;background:transparent;border-radius:18px;padding:7px;font-size:8px;font-weight:800;color:var(--muted)}.bottom button.on{background:#111827;color:#fff}.bottom span{display:block;font-size:17px}.modal{display:none;position:fixed;inset:0;background:#000;z-index:200}.modal.open{display:block}.reels{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}.reel{height:100dvh;position:relative;scroll-snap-align:start}.reel img{width:100%;height:100%;object-fit:cover;opacity:.68}.reel-copy{position:absolute;z-index:2;left:20px;right:20px;bottom:8%;color:#fff}.reel-copy h2{font-size:clamp(28px,6vw,54px);line-height:1.1;margin:8px 0}.close{position:fixed;z-index:3;right:15px;top:15px;width:44px;height:44px;border-radius:50%;border:1px solid #ffffff55;background:#ffffff22;color:white;font-size:25px}@media(max-width:760px){.app{padding:7px 9px 90px}.header{top:5px}.brand{font-size:18px}.hero{height:390px;border-radius:24px}.hero-copy{left:18px;right:18px;bottom:18px}.hero h1{font-size:27px}.trend{grid-template-columns:1fr 1fr}.trend-card:first-child{grid-column:span 2;height:200px}.trend-card{height:145px}.trend-copy h3{font-size:11px}.feed{grid-template-columns:1fr}.thumb{height:210px}.ticker{display:none}}
</style></head><body><div class="app">
<header class="header glass"><div class="brand">नेपाल<b>हब</b></div><div class="search"><i>⌕</i><input id="search" placeholder="समाचार, व्यक्ति वा विषय खोज्नुहोस्…"></div><button class="icon" id="refresh">↻</button><button class="icon" id="openReels">▶</button></header>
<nav class="nav" id="nav"></nav><div class="ticker glass"><strong>ब्रेकिङ</strong><span id="ticker">ताजा समाचार लोड हुँदैछ…</span></div>
<main><section class="hero" id="hero"></section>
<section class="section"><div class="section-head"><div><h2>आजका स्टोरीहरू</h2><p>ट्याप गरेर समाचार रिल्स हेर्नुहोस्</p></div></div><div class="stories" id="stories"></div></section>
<section class="section"><div class="section-head"><div><h2>ट्रेन्डिङ समाचार</h2><p>अहिले सबैभन्दा चर्चामा रहेका विषयहरू</p></div></div><div class="trend" id="trending"></div></section>
<section class="section"><div class="section-head"><div><h2>ताजा समाचार</h2><p id="status">लोड हुँदैछ…</p></div></div><div class="chips" id="filters"></div><div class="feed" id="feed"></div></section></main></div>
<nav class="bottom glass"><button class="on" onclick="scrollTo({top:0,behavior:'smooth'})"><span>⌂</span>होम</button><button onclick="document.getElementById('trending').scrollIntoView({behavior:'smooth'})"><span>⌁</span>ट्रेन्डिङ</button><button onclick="openReels()"><span>▶</span>रिल्स</button><button onclick="search.focus()"><span>⌕</span>खोज्नुहोस्</button></nav>
<div class="modal" id="modal"><button class="close" id="close">×</button><div class="reels" id="reels"></div></div>
<script>
const CATS=[['all','सबै'],['nepal','नेपाल'],['politics','राजनीति'],['finance','अर्थतन्त्र'],['sports','खेलकुद'],['tech','प्रविधि'],['entertainment','मनोरञ्जन'],['world','विश्व']];let allNews=[],active='all';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const ago=d=>{let m=Math.floor((Date.now()-new Date(d))/60000);return !Number.isFinite(m)||m<0?'अहिले':m<60?m+' मिनेट अघि':m<1440?Math.floor(m/60)+' घण्टा अघि':Math.floor(m/1440)+' दिन अघि'};const image=x=>x.thumb||x.image||'';
function filtered(){let q=search.value.toLowerCase().trim();return allNews.filter(x=>(active==='all'||(x.storyCategory||x.category)===active)&&(!q||(`${x.title} ${x.source} ${x.desc}`).toLowerCase().includes(q)))}
function cats(){nav.innerHTML=filters.innerHTML=CATS.map(([v,t])=>`<button class="${v===active?'on':''}" data-c="${v}">${t}</button>`).join('');document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{active=b.dataset.c;cats();render()})}
function hero(){let x=filtered()[0]||allNews[0];if(!x)return;hero.innerHTML=`<img src="${esc(image(x))}"><div class="hero-copy"><div class="label">${x.isBreaking?'🔴 ब्रेकिङ · ':'ताजा प्रमुख समाचार · '}${esc(x.source||'नेपाल')}</div><h1>${esc(x.title)}</h1><p>${esc(x.desc||'नेपाल र विश्वका ताजा समाचारहरू।')}</p></div>`}
function render(){let data=filtered();hero();stories.innerHTML=allNews.slice(0,16).map((x,i)=>`<button class="story" onclick="openReels(${i})"><div class="ring"><img src="${esc(image(x))}"></div><b>${esc(x.source||'समाचार')}</b></button>`).join('');let rank=[...allNews].sort((a,b)=>Number(b.isBreaking)-Number(a.isBreaking)||(b.sourceCount||0)-(a.sourceCount||0)).slice(0,3);trending.innerHTML=rank.map(x=>`<article class="trend-card"><img src="${esc(image(x))}"><div class="trend-copy"><span class="badge ${x.isBreaking?'breaking':''}">${x.isBreaking?'ब्रेकिङ':'ट्रेन्डिङ'} · ${x.sourceCount||1} स्रोत</span><h3>${esc(x.title)}</h3></div></article>`).join('');feed.innerHTML=data.length?data.slice(0,120).map(x=>`<article class="card glass"><div class="thumb"><img src="${esc(image(x))}"></div><div class="body"><div class="meta">${esc(x.source||'समाचार')}</div><div class="time">${ago(x.pubDate)}</div><h3>${esc(x.title)}</h3><p>${esc(x.desc||'')}</p><a class="read" href="${esc(x.link)}" target="_blank" rel="noopener">पूरा समाचार ↗</a></div></article>`).join(''):'<div class="glass" style="padding:35px;border-radius:20px;text-align:center">समाचार भेटिएन।</div>';status.textContent=data.length+' समाचार उपलब्ध';ticker.textContent=allNews.find(x=>x.isBreaking)?.title||allNews[0]?.title||'ताजा समाचार उपलब्ध छैन'}
function openReels(i=0){modal.classList.add('open');reels.innerHTML=allNews.slice(0,60).map(x=>`<article class="reel"><img src="${esc(image(x))}"><div class="reel-copy"><span class="badge">${x.isBreaking?'🔴 ब्रेकिङ':'समाचार'} · ${esc(x.source||'नेपाल')}</span><h2>${esc(x.title)}</h2><p>${esc(x.desc||'')}</p><a class="read" style="display:inline-block;padding:11px 18px" href="${esc(x.link)}" target="_blank">पूरा समाचार ↗</a></div></article>`).join('');setTimeout(()=>reels.scrollTo({top:i*innerHeight,behavior:'smooth'}),20)}
close.onclick=()=>modal.classList.remove('open');openReels.onclick=()=>openReels(0);search.oninput=render;refresh.onclick=load;
async function load(){status.textContent='समाचार अपडेट हुँदैछ…';try{let r=await fetch('./news.json?ts='+Date.now(),{cache:'no-store'}),d=await r.json();allNews=Array.isArray(d.items)?d.items:[];cats();render()}catch(e){status.textContent='समाचार फिड अहिले उपलब्ध छैन।'}}
load();setInterval(load,300000);
</script></body></html>
