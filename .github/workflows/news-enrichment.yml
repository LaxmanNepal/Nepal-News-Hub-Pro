name: News Image Enrichment
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/fetch_news.py
      - run: python scripts/enrich_news.py
      - run: python scripts/news_intelligence.py
      - run: python scripts/build_trending.py
      - run: python scripts/generate_seo.py
      - name: Commit generated news
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news.json news-pages sitemap.xml data
          git diff --cached --quiet || git commit -m 'chore: refresh news images and story data'
          git push
