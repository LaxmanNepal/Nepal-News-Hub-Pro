name: Nepal News Engine
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - '.github/workflows/news-engine.yml'
permissions:
  contents: write
concurrency:
  group: news-engine
  cancel-in-progress: true
jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch RSS and Atom feeds
        run: python scripts/fetch_news.py
      - name: Validate news feed and images
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('news.json').read_text(encoding='utf-8'))
          assert isinstance(d.get('items'), list) and d['items'], 'No news items generated'
          assert d.get('sourcesAttempted', 0) >= 40, 'Feed coverage unexpectedly low'
          assert all(x.get('title') and x.get('link') for x in d['items']), 'Invalid story found'
          print(f"Validated {len(d['items'])} stories; feeds={d.get('sourcesAttempted')}; imageCoverage={d.get('imageCoverage',0)}")
          PY
      - name: Run intelligence layer
        run: python scripts/news_intelligence.py
      - name: Build trending clusters
        run: python scripts/build_trending.py
      - name: Generate source health
        run: |
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          data=json.loads(Path('news.json').read_text(encoding='utf-8'))
          failed={x['url']:x.get('error','unknown') for x in data.get('failedSources',[])}
          from scripts.fetch_news import FEEDS
          health=[{'url':u,'category':c,'ok':u not in failed,'error':failed.get(u)} for c,urls in FEEDS.items() for u in urls]
          Path('data/source-health.json').write_text(json.dumps({'updatedAt':datetime.now(timezone.utc).isoformat(),'working':sum(x['ok'] for x in health),'failed':sum(not x['ok'] for x in health),'sources':health},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Generate SEO pages
        run: python scripts/generate_seo.py
      - name: Commit generated intelligence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news.json data/source-health.json data/trending.json data/entities.json news-pages sitemap.xml
          git diff --cached --quiet || git commit -m 'chore: refresh Nepal news intelligence'
          git push
