# Nepal News Hub Pro - build, refresh and deploy
name: Nepal News Hub Pro - Live Feed Deploy

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch live Nepal news
        run: python scripts/fetch_news.py

      - name: Inject static-first news engine
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          html = p.read_text(encoding="utf-8")
          tag = '<script src="js/news-engine.js"></script>'
          if tag not in html:
              html = html.replace('</body>', f'{tag}\n</body>')
              p.write_text(html, encoding='utf-8')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
